name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.3"

jobs:
  gut-tests:
    name: Headless GUT tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --verbose --path . --import --quit

      - name: Run GUT test suite
        run: |
          godot --headless --path . \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -ginclude_subdirs \
            -gexit

  export-smoke:
    name: Export smoke build (Linux)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --verbose --path . --import --quit

      - name: Install export templates
        run: |
          mkdir -v -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/"

      - name: Export Linux smoke build
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --path . \
            --export-debug "Linux Smoke Build" build/linux/the-lost-choir.x86_64

      - name: Upload smoke build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-build
          path: build/linux/
          retention-days: 7

  export-macos:
    name: Export macOS build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --verbose --path . --import --quit

      - name: Install export templates
        run: |
          mkdir -v -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/"

      - name: Export macOS build
        run: |
          mkdir -v -p "build/macos"
          godot --headless --verbose --path . \
            --export-debug "macOS" "build/macos/The Lost Choir.app"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/
          retention-days: 7
